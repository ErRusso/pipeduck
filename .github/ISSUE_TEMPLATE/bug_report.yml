name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include private audio stream names if you need to redact them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Join a call
        2. Start pipeduck
        3. Select ...
        4. Observe ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Ducking mode
      options:
        - Call audio
        - My microphone
        - Call audio or microphone
        - Not applicable / tray or CLI issue
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PipeDuck version
      description: Output of `pipeduck --version`
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Distribution, desktop/tray host, PipeWire and WirePlumber versions.
      placeholder: |
        Distribution: Arch Linux
        Desktop: KDE Plasma 6
        PipeWire: 1.6.9
        WirePlumber: 0.5.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Status and logs
      description: Output of `pipeduck status`, and `pipeduck route --yes-really-route` if relevant.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
