name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.compiler }}, GUI ${{ matrix.gui }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        gui: [ON, OFF]
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config dbus libpipewire-0.3-dev libpulse-dev libjson-c-dev \
            libglib2.0-dev libgtk-4-dev libncurses-dev

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPIPEDUCK_GUI=${{ matrix.gui }}
          -DPIPEDUCK_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install clang-format
        run: pip install clang-format==18.1.8
      - name: Check formatting
        run: |
          git ls-files 'src/*.cpp' 'include/*.hpp' 'tests/*.cpp' \
            | xargs clang-format --dry-run --Werror
