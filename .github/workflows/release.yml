name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and archive (GUI ${{ matrix.gui }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gui: [ON, OFF]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libpipewire-0.3-dev libpulse-dev libjson-c-dev \
            libglib2.0-dev libgtk-4-dev libncurses-dev

      - name: Configure
        run: >
          cmake -S . -B "build-${{ matrix.gui }}"
          -DCMAKE_BUILD_TYPE=Release
          -DPIPEDUCK_GUI=${{ matrix.gui }}
          -DPIPEDUCK_BUILD_TESTS=ON
          -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/prefix"

      - name: Build
        run: cmake --build "build-${{ matrix.gui }}" --parallel

      - name: Test
        run: ctest --test-dir "build-${{ matrix.gui }}" --output-on-failure

      - name: Install smoke test
        run: |
          cmake --install "build-${{ matrix.gui }}"
          tests/install_smoke.sh "$RUNNER_TEMP/prefix"

  archive:
    name: Source archive
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create versioned source archive and checksum
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          mkdir -p artifacts
          git archive --format=tar.gz --prefix="pipeduck-${version}/" \
            -o "artifacts/pipeduck-${version}.tar.gz" HEAD
          (cd artifacts && sha256sum "pipeduck-${version}.tar.gz" \
            > "pipeduck-${version}.tar.gz.sha256")
          cat "artifacts/pipeduck-${version}.tar.gz.sha256"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-archive
          path: artifacts/

  publish:
    name: Publish GitHub release
    needs: archive
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
